
[project]
name = "biblio-api"
version = "0.1.0"
description = "API para gerenciamento de biblioteca"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "httpx",
]

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 79

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]

[tool.ruff.format]
preview = true
quote-style = "single"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["teste"]
python_files = ["teste_*.py"]
addopts = [
    "-p",
    "no:warnings",
    "--cov=app",
    "--cov-context=test",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"